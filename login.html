<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Quiz Vault</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #1e293b; min-height: 100vh; padding: 20px; }

        .container { max-width: 900px; margin: 0 auto; }
        
        /* Header Card */
        .admin-header { background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .admin-title { font-size: 20px; font-weight: bold; color: #1e3a8a; }
        .admin-email { font-size: 13px; color: #64748b; margin-top: 4px; }
        
        .btn-logout { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-logout:hover { background: #dc2626; }

        .back-home { display: inline-block; margin-bottom: 15px; font-size: 13px; color: #93c5fd; text-decoration: none; font-weight: 600; }
        .back-home:hover { text-decoration: underline; }

        /* Section Cards */
        .admin-card { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .section-heading { font-size: 18px; font-weight: bold; color: #1e293b; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        /* Table Styling */
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: #f1f5f9; color: #475569; font-size: 13px; padding: 12px; border-bottom: 2px solid #cbd5e1; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 13px; color: #334155; }
        tr:hover { background-color: #f8fafc; }

        .no-data { text-align: center; color: #64748b; padding: 20px; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-home">← Back to Home / Dashboard</a>

        <!-- Admin Top Profile Bar -->
        <div class="admin-header">
            <div>
                <div class="admin-title">⚙️ Quiz Vault Admin Panel</div>
                <div class="admin-email" id="adminEmailDisplay">Logged in as: Loading...</div>
            </div>
            <button class="btn-logout" id="logoutBtn">Logout</button>
        </div>

        <!-- Users List Section -->
        <div class="admin-card">
            <div class="section-heading">👥 Registered / Logged-in Users List</div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Sr. No.</th>
                            <th>User Name</th>
                            <th>Email Address</th>
                            <th>First Login Time</th>
                        </tr>
                    </thead>
                    <tbody id="adminUsersTableBody">
                        <!-- Dynamic JavaScript data will load here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Security Check: Only allow support.quizvault@gmail.com
        const loggedUserEmail = localStorage.getItem("userEmail");
        const adminEmailDisplay = document.getElementById('adminEmailDisplay');

        if (!loggedUserEmail || loggedUserEmail !== "support.quizvault@gmail.com") {
            alert("Access Denied! Only Admin can view this page.");
            window.location.href = "index.html";
        } else {
            adminEmailDisplay.innerText = "Logged in as: " + loggedUserEmail;
        }

        // Load Users List from LocalStorage into Table
        window.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.getElementById('adminUsersTableBody');
            const savedUsers = JSON.parse(localStorage.getItem("allQuizVaultUsers")) || [];

            if (savedUsers.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="no-data">No users have logged in yet.</td></tr>`;
                return;
            }

            let html = "";
            savedUsers.forEach((user, index) => {
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td style="font-weight: 600;">${user.name || 'N/A'}</td>
                        <td style="color: #2563eb;">${user.email}</td>
                        <td style="color: #64748b;">${user.loginTime || 'Recent'}</td>
                    </tr>
                `;
            });
            tableBody.innerHTML = html;
        });

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem("userEmail");
            localStorage.removeItem("userName");
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
