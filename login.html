<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Quiz Vault Notebook</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; perspective: 1200px; overflow: hidden; }

        /* Notebook Container */
        .notebook-wrapper { width: 340px; height: 460px; position: relative; transform-style: preserve-3d; transition: transform 0.6s ease; }
        
        /* Notebook Base / Back Cover */
        .notebook { width: 100%; height: 100%; position: absolute; background: #ffffff; border-radius: 4px 12px 12px 4px; box-shadow: 0 20px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; border-left: 18px solid #334155; }
        
        /* Notebook Lines Effect */
        .notebook::before { content: ''; position: absolute; top: 0; left: 40px; width: 2px; height: 100%; background: #fca5a5; }
        .notebook-content { width: 100%; background: linear-gradient(to bottom, transparent 24px, #e2e8f0 25px); background-size: 100% 25px; padding: 20px 10px 20px 30px; border-radius: 8px; }

        /* Front Cover */
        .cover { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); border-radius: 4px 12px 12px 4px; box-shadow: 5px 10px 20px rgba(0,0,0,0.4); transform-origin: left; transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; padding: 20px; z-index: 2; border-left: 18px solid #0f172a; cursor: pointer; }

        .cover-title { font-size: 24px; font-weight: bold; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .cover-subtitle { font-size: 13px; color: #93c5fd; margin-bottom: 30px; }
        .btn-open { padding: 10px 22px; background: #ffffff; color: #1e3a8a; border: none; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: transform 0.2s; }
        .btn-open:hover { transform: scale(1.05); }

        /* Notebook Open Class */
        .notebook-wrapper.open .cover { transform: rotateY(-160deg); }

        /* Inner Page Elements */
        .logo { font-size: 22px; font-weight: bold; color: #2563eb; margin-bottom: 10px; }
        .inner-title { font-size: 18px; color: #0f172a; margin-bottom: 6px; font-weight: bold; }
        .inner-desc { font-size: 12px; color: #64748b; margin-bottom: 25px; }

        .btn-google { width: 100%; padding: 10px; background-color: #ffffff; color: #374151; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: all 0.2s; }
        .btn-google:hover { background-color: #f8fafc; border-color: #94a3b8; }
        .btn-google img { width: 18px; height: 18px; }

        .back-home { display: inline-block; margin-top: 20px; font-size: 12px; color: #2563eb; text-decoration: none; font-weight: 600; }
        .back-home:hover { text-decoration: underline; }
        .status-msg { font-size: 12px; color: #16a34a; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="notebook-wrapper" id="notebookWrapper">
        <!-- Cover Page (Front) -->
        <div class="cover" id="coverBtn">
            <div class="cover-title">🔐 Quiz Vault</div>
            <div class="cover-subtitle">Personal Study Notebook</div>
            <button type="button" class="btn-open">Click to Open 📖</button>
        </div>

        <!-- Inner Page (Notebook Content) -->
        <div class="notebook">
            <div class="notebook-content">
                <div class="logo">Quiz Vault</div>
                <div class="inner-title">Welcome Back!</div>
                <div class="inner-desc">Sign in with Google to unlock your quizzes & PDFs.</div>

                <!-- Google Login Button -->
                <button type="button" class="btn-google" id="googleLoginBtn">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
                    Sign in with Google
                </button>

                <div id="statusMsg" class="status-msg"></div>

                <a href="index.html" class="back-home">← Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKThjP8KihJsLdqMN8LbG2TOIVzRFaZLQ",
            authDomain: "quizvault-2380c.firebaseapp.com",
            projectId: "quizvault-2380c",
            storageBucket: "quizvault-2380c.firebasestorage.app",
            messagingSenderId: "41706191360",
            appId: "1:41706191360:web:d6a7178baae8d51e0eb6e5",
            measurementId: "G-CVNQY2QJPQ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const wrapper = document.getElementById('notebookWrapper');
        const cover = document.getElementById('coverBtn');
        const statusMsg = document.getElementById('statusMsg');

        // Cover Click to Open
        cover.addEventListener('click', (e) => {
            e.preventDefault();
            wrapper.classList.add('open');
        });

        // 1. Google se redirect hone ke baad result check karna
        getRedirectResult(auth)
            .then((result) => {
                if (result && result.user) {
                    const user = result.user;
                    localStorage.setItem("userEmail", user.email);
                    localStorage.setItem("userName", user.displayName);
                    
                    statusMsg.innerText = "Login Successful! Redirecting...";
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1000);
                }
            })
            .catch((error) => {
                console.error("Redirect Login Error:", error);
                alert("Login Failed: " + error.message);
            });

        // 2. Google Login Button Click Action
        document.getElementById('googleLoginBtn').addEventListener('click', (e) => {
            e.preventDefault();
            statusMsg.innerText = "Connecting to Google...";
            signInWithRedirect(auth, provider);
        });
    </script>
</body>
</html>
