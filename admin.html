<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Quiz Vault</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        #loginBox { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        #loginBox h2 { margin-bottom: 15px; color: #2563eb; }
        #loginBox input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 15px; outline: none; font-size: 15px; }
        #loginBox button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        #adminContent { display: none; width: 100%; max-width: 500px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin-bottom: 20px; color: #0f172a; text-align: center; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input[type="text"], input[type="number"], input[type="file"], textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; }
        .btn-submit { width: 100%; padding: 12px; background: #16a34a; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-logout { width: 100%; padding: 10px; background: #dc2626; color: white; border: none; border-radius: 6px; margin-top: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 🔒 Admin Login Screen -->
    <div id="loginBox">
        <h2>🔒 Admin Login</h2>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 15px;">Enter Admin Credentials</p>
        <form onsubmit="checkCredentials(event)">
            <input type="text" id="adminUser" placeholder="Enter Username" required autocomplete="off">
            <input type="password" id="adminPass" placeholder="Enter Password" required autocomplete="off">
            <button type="submit">Login to Admin</button>
        </form>
    </div>

    <!-- ⚙️ Admin Content -->
    <div id="adminContent">
        <h1>⚙️ Upload New PDF / Quiz</h1>
        <form id="uploadForm">
            <div class="form-group">
                <label>PDF Title</label>
                <input type="text" id="pdfTitle" placeholder="e.g. SSC CGL Reasoning: Blood Relation" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="pdfDesc" rows="3" placeholder="Description details..." required></textarea>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="isFree" onchange="togglePriceInput(this)">
                <label for="isFree" style="margin: 0; cursor: pointer;">Is this PDF Free?</label>
            </div>
            <div class="form-group" id="priceGroup">
                <label>Price (₹)</label>
                <input type="number" id="pdfPrice" placeholder="5" value="5">
            </div>
            
            <!-- 🔑 PDF Password Field -->
            <div class="form-group">
                <label>PDF Unlock Password (Optional)</label>
                <input type="text" id="pdfPassword" placeholder="e.g. CGL2026 or 12345">
                <small style="color: #64748b; font-size: 11px;">Payment karne ke baad customer ko yeh password dikhaya jayega.</small>
            </div>

            <div class="form-group">
                <label>Select PDF File</label>
                <input type="file" id="pdfFile" accept="application/pdf" required>
            </div>
            <button type="submit" class="btn-submit">🚀 Upload PDF to Website</button>
        </form>
        <button class="btn-logout" onclick="logout()">🔒 Logout</button>
    </div>

    <script>
        const SECRET_USERNAME = "Aandher1*@123";
        const SECRET_PASSWORD = "Aandher1*@";

        function checkCredentials(event) {
            if(event) event.preventDefault();
            const inputUser = document.getElementById("adminUser").value.trim();
            const inputPass = document.getElementById("adminPass").value.trim();

            if (inputUser === SECRET_USERNAME && inputPass === SECRET_PASSWORD) {
                try { sessionStorage.setItem("adminLoggedIn", "true"); } catch(e) {}
                showAdminPanel();
            } else {
                alert("❌ Wrong Username or Password!");
            }
        }

        function showAdminPanel() {
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("adminContent").style.display = "block";
        }

        function logout() {
            try { sessionStorage.removeItem("adminLoggedIn"); } catch(e) {}
            location.reload();
        }

        function togglePriceInput(checkbox) {
            document.getElementById("priceGroup").style.display = checkbox.checked ? "none" : "block";
        }

        window.onload = function() {
            try {
                if (sessionStorage.getItem("adminLoggedIn") === "true") showAdminPanel();
            } catch(e) {}
        };

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("QuizVaultDB", 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains("pdfFiles")) {
                        db.createObjectStore("pdfFiles", { keyPath: "id", autoIncrement: true });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        document.getElementById("uploadForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            
            const title = document.getElementById("pdfTitle").value;
            const desc = document.getElementById("pdfDesc").value;
            const isFree = document.getElementById("isFree").checked;
            const price = isFree ? 0 : document.getElementById("pdfPrice").value;
            const pdfPass = document.getElementById("pdfPassword").value.trim();
            const fileInput = document.getElementById("pdfFile").files[0];

            if (!fileInput) return alert("Please select a PDF file.");

            const reader = new FileReader();
            reader.readAsDataURL(fileInput);
            reader.onload = async function() {
                const base64File = reader.result;
                const db = await openDB();
                const tx = db.transaction("pdfFiles", "readwrite");
                const store = tx.objectStore("pdfFiles");

                store.add({
                    title: title,
                    desc: desc,
                    isFree: isFree,
                    price: price,
                    pdfPassword: pdfPass, // Password database me save ho jayega
                    fileData: base64File
                });

                tx.oncomplete = () => {
                    alert("🎉 PDF Uploaded Successfully!");
                    document.getElementById("uploadForm").reset();
                };
            };
        });
    </script>
</body>
</html>
