<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Vault - Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f8fafc; color: #1e293b; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 800px; margin: 0 auto 20px; }
        .logo { font-size: 20px; font-weight: bold; color: #2563eb; }
        .btn-view { padding: 8px 16px; background: #2563eb; color: white; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 600; }
        
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { font-size: 22px; margin-bottom: 20px; color: #0f172a; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        
        .btn-upload { width: 100%; padding: 12px; background: #16a34a; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 16px; }
        .btn-upload:hover { background: #15803d; }
        
        .file-list { margin-top: 30px; border-top: 2px solid #f1f5f9; padding-top: 20px; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 10px; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">🔐 Quiz Vault Admin</div>
        <a href="index.html" class="btn-view" target="_blank">View Live Site ↗</a>
    </div>

    <div class="container">
        <h1>Upload New PDF / Quiz</h1>
        
        <form id="uploadForm" onsubmit="handleUpload(event)">
            <div class="form-group">
                <label>PDF Title / Name</label>
                <input type="text" id="pdfTitle" placeholder="e.g. Class 10 History Chapter 1 Quiz" required>
            </div>

            <div class="form-group">
                <label>Pages Count or Description</label>
                <input type="text" id="pdfDesc" placeholder="e.g. 15 Pages • Important Questions" required>
            </div>

            <div class="form-group">
                <label>Access Type / Price (₹)</label>
                <input type="number" id="pdfPrice" placeholder="0 for Free, or enter amount (e.g. 10)" required>
            </div>

            <div class="form-group">
                <label>Select PDF File</label>
                <input type="file" id="pdfFile" accept="application/pdf" required>
            </div>

            <button type="submit" class="btn-upload">📤 Upload PDF to Website</button>
        </form>

        <div class="file-list">
            <h2>Uploaded Files Management</h2>
            <div id="uploadedFilesContainer" style="margin-top: 15px;">
                <!-- Dynamically populated files -->
            </div>
        </div>
    </div>

    <script>
        // IndexedDB Database Setup
        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("QuizVaultDB", 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains("pdfFiles")) {
                        db.createObjectStore("pdfFiles", { keyPath: "id", autoIncrement: true });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function handleUpload(e) {
            e.preventDefault();
            const title = document.getElementById("pdfTitle").value;
            const desc = document.getElementById("pdfDesc").value;
            const price = parseInt(document.getElementById("pdfPrice").value);
            const fileInput = document.getElementById("pdfFile");
            const file = fileInput.files[0];

            if (!file) return alert("Please select a PDF file!");

            const reader = new FileReader();
            reader.onload = async function(event) {
                const fileData = event.target.result; // Base64 PDF Data

                const newPdf = {
                    title: title,
                    desc: desc,
                    price: price,
                    isFree: price === 0,
                    fileData: fileData,
                    uploadDate: new Date().toLocaleDateString()
                };

                const db = await openDB();
                const tx = db.transaction("pdfFiles", "readwrite");
                const store = tx.objectStore("pdfFiles");
                store.add(newPdf);

                tx.oncomplete = () => {
                    alert("🎉 PDF Uploaded Successfully! It is now live on your website.");
                    document.getElementById("uploadForm").reset();
                    loadUploadedFiles();
                };
            };

            reader.readAsDataURL(file);
        }

        async function loadUploadedFiles() {
            const db = await openDB();
            const tx = db.transaction("pdfFiles", "readonly");
            const store = tx.objectStore("pdfFiles");
            const request = store.getAll();

            request.onsuccess = () => {
                const files = request.result;
                const container = document.getElementById("uploadedFilesContainer");
                container.innerHTML = "";

                if (files.length === 0) {
                    container.innerHTML = "<p style='color:#64748b; font-size:14px;'>No custom PDFs uploaded yet.</p>";
                    return;
                }

                files.forEach(file => {
                    const div = document.createElement("div");
                    div.className = "file-item";
                    div.innerHTML = `
                        <div>
                            <strong>${file.title}</strong>
                            <p style="font-size:12px; color:#64748b;">${file.desc} • ${file.price === 0 ? 'FREE' : '₹' + file.price}</p>
                        </div>
                        <button class="btn-delete" onclick="deleteFile(${file.id})">Delete</button>
                    `;
                    container.appendChild(div);
                });
            };
        }

        async function deleteFile(id) {
            if (confirm("Are you sure you want to delete this PDF?")) {
                const db = await openDB();
                const tx = db.transaction("pdfFiles", "readwrite");
                const store = tx.objectStore("pdfFiles");
                store.delete(id);
                tx.oncomplete = () => loadUploadedFiles();
            }
        }

        window.onload = loadUploadedFiles;
    </script>
</body>
</html>
