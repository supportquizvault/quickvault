<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Quiz Vault</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* Lock Screen */
        #loginBox { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        #loginBox h2 { margin-bottom: 15px; color: #2563eb; }
        #loginBox input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 15px; outline: none; font-size: 15px; }
        #loginBox button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        /* Main Admin Panel */
        #adminContent { display: none; width: 100%; max-width: 500px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin-bottom: 20px; color: #0f172a; text-align: center; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input[type="text"], input[type="number"], input[type="file"], textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; }
        .btn-submit { width: 100%; padding: 12px; background: #16a34a; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-logout { width: 100%; padding: 10px; background: #dc2626; color: white; border: none; border-radius: 6px; margin-top: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="loginBox">
        <h2>🔒 Admin Login</h2>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 15px;">Enter Admin Credentials</p>
        <input type="text" id="adminUser" placeholder="Enter Username">
        <input type="password" id="adminPass" placeholder="Enter Password">
        <button onclick="checkCredentials()">Login to Admin</button>
    </div>

    <div id="adminContent">
        <h1>⚙️ Upload New PDF / Quiz</h1>
        <form id="uploadForm">
            <div class="form-group">
                <label>PDF Title</label>
                <input type="text" id="pdfTitle" placeholder="e.g. Class 10 Science Notes" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="pdfDesc" rows="3" placeholder="e.g. 15 Pages • Hand written notes" required></textarea>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="isFree" onchange="togglePriceInput(this)">
                <label for="isFree" style="margin: 0; cursor: pointer;">Is this PDF Free?</label>
            </div>
            <div class="form-group" id="priceGroup">
                <label>Price (₹)</label>
                <input type="number" id="pdfPrice" placeholder="5" value="5">
            </div>
            <div class="form-group">
                <label>Select PDF File</label>
                <input type="file" id="pdfFile" accept="application/pdf" required>
            </div>
            <button type="submit" class="btn-submit">🚀 Upload PDF to Website</button>
        </form>
        <button class="btn-logout" onclick="logout()">🔒 Logout</button>
    </div>
